# Environment for the scripts in this folder. Plots lives here rather than in
# the package's own Project.toml so that loading ACI216 does not install the
# Plots/GR/Qt stack in every downstream project.
#
#   julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
#   julia --project=scripts scripts/demo.jl

[deps]
ACI216 = "9b36f528-c610-413a-8a0c-c354fc8dc317"
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"

[sources]
ACI216 = {path = ".."}
